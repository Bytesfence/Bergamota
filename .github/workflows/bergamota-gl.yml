name: Bergamota GL payload (bergamota-gl)

# The macOS-only half of the GLES route (docs/GPU_EAGL.md): Mesa 25.0.7 cross-built for
# iOS arm64e (OSMesa ES + gallium freedreno a6xx over the SweetAdreno libdrm stand-in),
# the OpenGLES injection shim and bgl-launch, packaged as the payload that the Renegade
# "bglrender" root tweak installs into /usr/local/lib/bergamota-gl/.
#   gpu/eagl/mesa/build-mesa.sh   (MESA clone + venv are self-staged into GPU_EAGL_WORK)
#   gpu/eagl/make-payload.sh      (shim + launcher + pacstrip --sign + MANIFEST)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "gpu/eagl/**"
      - "gpu/freedreno-sweet/**"
      - ".github/workflows/bergamota-gl.yml"

concurrency:
  group: bergamota-gl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    # macos-15 = Xcode 16.x toolchain (same fleet the xnu-11215 kernel builds use)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install meson bison pkg-config
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Mesa (OSMesa ES, softpipe + freedreno/a6xx)
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/work
        run: |
          df -h "$RUNNER_TEMP" || true
          gpu/eagl/mesa/build-mesa.sh
          ls -l "$GPU_EAGL_WORK/build-hw/src/gallium/targets/osmesa/libOSMesa.8.dylib"

      - name: Package payload
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/work
        run: |
          gpu/eagl/make-payload.sh "$PWD/out/bergamota-gl"
          cat "$PWD/out/bergamota-gl/MANIFEST.sha256"
          du -sh "$PWD/out/bergamota-gl"

      - uses: actions/upload-artifact@v4
        with:
          name: bergamota-gl
          path: out/bergamota-gl/
          retention-days: 14
          if-no-files-found: error
