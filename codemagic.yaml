workflows:
  libbgair-ios:
    name: libbgair (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
    scripts:
      - name: dependencies
        script: |
          set -e
          brew install -q meson bison ninja pkg-config
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q mako pyyaml meson
      - name: submodules (chlorophyll + mesa + libdrm)
        script: |
          set -e
          git config --global --add safe.directory "$CM_BUILD_DIR" || true
          git submodule update --init --recursive --depth 1 gpu/metal
          ls gpu/metal/mesa/src/compiler >/dev/null && echo "mesa OK"
          ls gpu/metal/libdrm/include/drm >/dev/null && echo "libdrm OK"
      - name: build libbgair.dylib
        script: |
          set -e
          export GPU_EAGL_VENV="$HOME/venv"
          bash tools/ci-build-libbgair-mac.sh
    artifacts:
      - out-mac/*.dylib
      - out-mac/*.log
